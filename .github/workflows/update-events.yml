name: Update events cache

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-events.yml"
      - "scripts/generate-events-nearby-static.js"
      - "server.js"
      - "events-nearby.config.js"
  schedule:
    - cron: "20 6,11,16 * * *"

permissions:
  contents: write

jobs:
  update-events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate static events API
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          OPENAGENDA_API_KEY: ${{ secrets.OPENAGENDA_API_KEY }}
          EVENTS_OPENAGENDA_ENABLED: "1"
          EVENTS_FORCE_REFRESH: "1"
        run: node scripts/generate-events-nearby-static.js

      - name: Commit updated cache
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update events cache"
          file_pattern: "api/*.json"
